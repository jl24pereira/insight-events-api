services:
  db:
    image: postgres:18.4-alpine3.23
    container_name: insight-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: insight_events
      POSTGRES_USER: insight
      POSTGRES_PASSWORD: insight
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insight -d insight_events"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: insight-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/insight_events
      DB_USER: insight
      DB_PASSWORD: insight
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  pgdata:
